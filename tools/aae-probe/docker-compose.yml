name: aae-probe

# Ephemeral WordPress + Elementor + Animation Addons for Elementor stack for
# checking a widget's real settings shape and render output against the
# actual plugin, instead of guessing from its PHP source. See README.md
# in this directory. Not part of the Ferncourt demo site (../../demo/) —
# bring it up, probe, tear it down with `docker compose down -v`.

services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wp
      MYSQL_PASSWORD: wp
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 2s
      retries: 90

  wordpress:
    image: wordpress:6.9-php8.2-apache
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8099:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_PASSWORD: wp
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DEBUG: "1"
      WORDPRESS_CONFIG_EXTRA: |
        define( 'WP_DEBUG_LOG', true );
        define( 'WP_DEBUG_DISPLAY', false );
    volumes:
      - wp_html:/var/www/html
      - ../../references:/refs:ro

  cli:
    image: wordpress:cli-2.12.0-php8.2
    user: "33:33"
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_PASSWORD: wp
      WORDPRESS_DB_NAME: wordpress
      HOME: /tmp
    volumes:
      - wp_html:/var/www/html
      - ../../references:/refs:ro
      - .:/probe:ro

volumes:
  wp_html:
