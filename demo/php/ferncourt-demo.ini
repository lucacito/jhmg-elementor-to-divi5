; PHP limits for the demo site. The official WordPress image ships PHP's defaults
; (2M uploads, 8M posts, 128M memory), which are too small for importing an Elementor kit.
upload_max_filesize = 256M
post_max_size = 256M
memory_limit = 512M
max_execution_time = 300
max_input_time = 300
max_input_vars = 5000
